<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Smart Campus</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-layout="landing">
  <header class="topnav" id="topnav"></header>
  <main class="login">
    <div class="card static">
      <span class="tile" data-icon="cap" data-size="26"></span>
      <h1>Welcome back</h1>
      <p class="small" style="margin-top:6px">Sign in to your Smart Campus account.</p>

      <form id="loginForm" novalidate style="margin-top:20px">
        <div class="chips">
          <button type="button" class="chip active" data-role="student">Student</button>
          <button type="button" class="chip" data-role="faculty">Faculty</button>
        </div>

        <div style="text-align:left;margin-bottom:14px">
          <label for="loginUser">Student ID</label>
          <input id="loginUser" type="text" autocomplete="username" placeholder="e.g. 24CS01023" required>
        </div>

        <div style="text-align:left;margin-bottom:8px">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password"
            required>
        </div>

        <p id="loginError" class="error" aria-live="polite"></p>
        <button class="btn" type="submit" style="width:100%;margin-top:4px">Sign in</button>
      </form>

      <p class="small" style="margin-top:16px">Don't have an account?
        <a href="register.html" style="color:var(--btn);font-weight:600">Create one</a>
      </p>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
