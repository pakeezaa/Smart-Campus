<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assignments | Smart Campus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-layout="app" data-role="student">
    <div class="app">
        <aside id="sidebar"></aside>
        <div class="content">
            <header class="topbar" id="topbar"></header>
            <main>
                <div class="page-head">
                    <h1>My Tasks</h1>
                </div>
                <form id="taskForm" class="card static task-form" novalidate>
                    <div><label for="taskTitle">Task Title</label><input id="taskTitle" type="text"></div>
                    <div><label for="taskCourse">Course</label><select id="taskCourse"></select></div>
                    <div><label for="taskDue">Due Date</label><input id="taskDue" type="date"></div>
                    <div><label for="taskPriority">Priority</label><select id="taskPriority">
                            <option>High</option>
                            <option selected>Medium</option>
                            <option>Low</option>
                        </select></div>
                    <button class="btn" type="submit">Add Task</button>
                </form><small class="error" id="taskError" role="alert"></small>
                <div id="taskList" class="tasks"></div>
            </main>
        </div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/tasks.js"></script>
</body>

</html>
