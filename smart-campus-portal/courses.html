<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses | SmartCampus Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Courses</h1>
<div class="toolbar">
<div><label for="search">Search by name or code</label><input id="search" type="search" placeholder="e.g. CS-301 or Web"></div>
<div><label for="semester">Semester</label><select id="semester"><option value="all">All semesters</option></select></div>
<div><label for="status">Status</label><select id="status"><option value="all">All statuses</option><option>Enrolled</option><option>Completed</option><option>Upcoming</option></select></div>
</div>
<p id="resultCount" class="muted" aria-live="polite"></p>
<div id="courseGrid" class="grid"></div>
</main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/courses.js"></script>
</body>
</html>
