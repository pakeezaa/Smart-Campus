<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks | SmartCampus Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Assignment &amp; task manager</h1>
<form id="taskForm" novalidate>
<div><label for="taskTitle">Task title</label><input id="taskTitle" type="text" placeholder="e.g. Finish portal project"></div>
<div><label for="taskCourse">Course</label><select id="taskCourse"></select></div>
<div><label for="taskDue">Due date</label><input id="taskDue" type="date"></div>
<div><label for="taskPriority">Priority</label><select id="taskPriority"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
<button class="btn" type="submit">Add task</button>
</form>
<section><h2>Your tasks</h2><div id="taskList"></div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/tasks.js"></script>
</body>
</html>
