<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gradebook | Smart Campus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-layout="app" data-role="faculty">
    <div class="app">
        <aside id="sidebar"></aside>
        <div class="content">
            <header class="topbar" id="topbar"></header>
            <main>
                <div class="page-head head-row">
                    <div>
                        <h1>Gradebook</h1>
                        <p>Marks, percentage and grade for every student.</p>
                    </div><button class="btn" id="exportBtn" type="button">Export CSV</button>
                </div>
                <div class="card static table-wrap" style="padding:8px">
                    <table>
                        <thead id="gradebookHead"></thead>
                        <tbody id="gradebookBody"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/faculty.js"></script>
</body>

</html>
